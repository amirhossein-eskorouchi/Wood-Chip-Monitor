name: Wood-Chip Monitor CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Public-release validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository without downloading LFS payloads
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit public-release boundary
        run: python scripts/audit_release.py
